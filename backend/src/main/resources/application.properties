# suppress inspection "AlphaUnsortedPropertiesFile" for whole file
# PostgresSQL Configuration
# spring.datasource.url=jdbc:mysql://localhost:3306/bombappetit
spring.datasource.url=jdbc:sqlite:./bombappetit.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.show-sql=false
#true
spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLiteDialect

server.ssl.enabled=false
server.port=8443
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=
server.ssl.key-alias=server

server.ssl.trust-store=classpath:truststore.jks
server.ssl.trust-store-password=app2324

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

#logging.level.org.springframework.web=WARN
logging.level.com.vieira.joao=TRACE